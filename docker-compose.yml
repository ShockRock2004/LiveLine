services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  liveline:
    build: .
    ports: ["8000:8000"]
    environment:
      LIVELINE_OLLAMA_URL: http://ollama:11434
      LIVELINE_PUBLIC_HOST: ${PUBLIC_HOST:-localhost:8000}
    volumes: [./state:/app/state]
    depends_on:
      ollama: {condition: service_healthy}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

volumes:
  ollama:
